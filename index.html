<title>What to Wear</title>
<style>
  :root {
    --bg: #FFE9A8;
    --ink: #2B2A33;
    --ink-soft: #5B5966;
    --ground: rgba(43, 42, 51, .14);
  }
  body[data-sky="cloud"] { --bg: #D9E2E8; }
  body[data-sky="fog"]   { --bg: #E3E3DE; }
  body[data-sky="rain"]  { --bg: #B7CADA; }
  body[data-sky="snow"]  { --bg: #E9EFF6; }
  body[data-sky="night"] { --bg: #27324F; --ink: #F3EFE4; --ink-soft: #B7BDD2; --ground: rgba(0, 0, 0, .3); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; cursor: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    transition: background-color 1.2s ease;
  }

  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    align-items: center;
    padding: 3vh 4vw 3vh 2vw;
    gap: 2vw;
  }

  #kid { height: 94vh; width: 100%; display: block; }

  .readout { min-width: 0; }
  .temp { font-size: 28vh; font-weight: 800; line-height: .9; letter-spacing: -.03em; margin: 0; }
  .temp sup { font-size: .38em; font-weight: 700; vertical-align: top; position: relative; top: .12em; margin-left: .04em; }
  .cond { font-size: 7vh; font-weight: 700; margin: 2vh 0 0; line-height: 1.1; }
  .range { font-size: 5vh; font-weight: 700; margin: 1.8vh 0 0; line-height: 1.1; }
  .meta { font-size: 4vh; color: var(--ink-soft); margin: 1vh 0 0; line-height: 1.3; }
  .wear { font-size: 4.8vh; font-weight: 700; margin: 4vh 0 0; line-height: 1.25; }
  .wear small { display: block; font-size: 3.5vh; font-weight: 600; color: var(--ink-soft); margin-bottom: .6vh; }
  .status { position: absolute; left: 2vw; bottom: 1.6vh; font-size: 2.8vh; color: var(--ink-soft); margin: 0; }

  /* Falling rain / snow, behind everything. Only runs when the sky needs it. */
  #precip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #precip i {
    position: absolute; top: -6vh; display: block;
    animation: fall linear infinite;
    opacity: 0;
  }
  body[data-precip="rain"] #precip i { width: .35vh; height: 4.5vh; background: #5E7F9C; border-radius: 1vh; opacity: .55; }
  body[data-precip="snow"] #precip i { width: 1.6vh; height: 1.6vh; background: #fff; border-radius: 50%; opacity: .9; }
  @keyframes fall { to { transform: translateY(112vh); } }
  @media (prefers-reduced-motion: reduce) { #precip { display: none; } }

  .layer { display: none; }

  /* ---------- Phone / portrait layout: kid on top, readout below, page scrolls ---------- */
  @media (orientation: portrait) {
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; cursor: auto; }
    main {
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      justify-items: center;
      gap: 1vh;
      padding: max(3vh, env(safe-area-inset-top)) 7vw max(5vh, env(safe-area-inset-bottom));
    }
    #kid { width: 100%; height: auto; max-height: 46vh; max-height: 46dvh; }
    .readout { width: 100%; text-align: center; }
    .temp { font-size: 27vw; }
    .cond { font-size: 8vw; margin-top: 1.5vh; }
    .range { font-size: 6vw; margin-top: 1.5vh; }
    .meta { font-size: 4.6vw; margin-top: .8vh; }
    .wear { font-size: 5.6vw; margin-top: 3vh; }
    .wear small { font-size: 4vw; }
    .status { position: static; font-size: 3.4vw; margin-top: 2vh; text-align: center; }
    #precip { position: fixed; }
    #precip i { top: -8vw; }
    body[data-precip="rain"] #precip i { width: .8vw; height: 9vw; }
    body[data-precip="snow"] #precip i { width: 3vw; height: 3vw; }
  }
</style>

<script>
/* ---------- Settings ---------- */
const LAT = 42.25;            // Set to your latitude
const LON = -71.00;           // Set to your longitude
const REFRESH_MS = 15 * 60 * 1000;
const RETRY_MS = 60 * 1000;

/* Clothing rules: edit the thresholds to match the kid's opinions. */
/* Dress days: she wears a dress on every other day (even dates) when it's 50° or warmer.
   Open the page with ?dress=1 or ?dress=0 to force it on or off. */
function dressToday() {
  const p = new URLSearchParams(location.search).get("dress");
  if (p === "1") return true;
  if (p === "0") return false;
  return new Date().getDate() % 2 === 0;
}

function outfit(feels, code, isDay, pop) {
  const dress = dressToday() && feels >= 50;
  const rain  = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code);
  const snow  = [71,73,75,77,85,86].includes(code);
  const sunny = [0, 1].includes(code) && isDay;
  const snowBoots = snow || feels < 25;
  return {
    heavyCoat:   feels < 35,
    lightJacket: feels >= 35 && feels < 60,
    hat:         feels < 45,
    mittens:     feels < 38,
    scarf:       feels < 40,
    dress:       dress,
    shorts:      feels >= 72 && !dress,
    pants:       feels < 72,   // shows as leggings under a dress
    sunglasses:  sunny && feels >= 45,
    umbrella:    rain || (pop >= 75 && !snow),   // also on dry-now days with a 75%+ chance
    rainBoots:   rain && !snowBoots,
    snowBoots:   snowBoots,
    sneakers:    !snowBoots && !(rain)
  };
}

const NAMES = {
  heavyCoat: "winter coat", lightJacket: "light jacket", hat: "hat", mittens: "mittens",
  scarf: "scarf", dress: "dress", shorts: "shorts", pants: "pants", sunglasses: "sunglasses",
  umbrella: "umbrella", rainBoots: "rain boots", snowBoots: "snow boots"
};

const CONDITIONS = {
  0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy",
  45: "Foggy", 48: "Foggy",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Rain showers", 81: "Rain showers", 82: "Heavy showers",
  85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"
};

function skyFor(code, isDay) {
  if ([71,73,75,77,85,86].includes(code)) return "snow";
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return "rain";
  if ([45,48].includes(code)) return "fog";
  if ([2,3].includes(code)) return "cloud";
  return isDay ? "clear" : "night";
}

/* ---------- Rain / snow particles ---------- */
const precip = document.getElementById("precip");
for (let i = 0; i < 36; i++) {
  const p = document.createElement("i");
  p.style.left = (Math.random() * 100) + "vw";
  p.style.animationDuration = (1.2 + Math.random() * 1.6) + "s";
  p.style.animationDelay = (-Math.random() * 3) + "s";
  precip.appendChild(p);
}
function setPrecip(code) {
  const snow = [71,73,75,77,85,86].includes(code);
  const rain = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code);
  document.body.dataset.precip = snow ? "snow" : rain ? "rain" : "none";
  // Snow falls slower than rain
  precip.querySelectorAll("i").forEach((p, i) => {
    p.style.animationDuration = snow ? (4 + (i % 5)) + "s" : (1.2 + (i % 7) * .25) + "s";
  });
}

/* ---------- Render ---------- */
function render(d) {
  const feels = Math.round(d.feels);
  const o = outfit(d.feels, d.code, d.isDay, d.pop);

  for (const [id, show] of Object.entries(o)) {
    const el = document.getElementById(id);
    if (el) el.style.display = show ? "block" : "none";
  }

  document.body.dataset.sky = skyFor(d.code, d.isDay);
  setPrecip(d.code);

  document.getElementById("temp").textContent = Math.round(d.temp);
  document.getElementById("cond").textContent = CONDITIONS[d.code] || "Mixed weather";
  document.getElementById("range").textContent =
    "High " + Math.round(d.hi) + "°  ·  Low " + Math.round(d.lo) + "°";
  document.getElementById("meta").textContent =
    "Feels like " + feels + "°  ·  Wind " + Math.round(d.wind) + " mph";

  // Label the chance as snow when the whole day stays near freezing
  const kind = d.hi <= 34 ? "Snow" : "Rain";
  document.getElementById("rain").textContent =
    kind + " chance " + (d.pop == null ? "--" : Math.round(d.pop) + "%");

  const items = Object.keys(NAMES).filter(k => o[k])
    .map(k => (k === "pants" && o.dress) ? "leggings" : NAMES[k]);
  document.getElementById("wear").innerHTML = "<small>Today, wear</small>" + items.join(", ");
}

/* ---------- Fetch ---------- */
function apiUrl(lat, lon) {
  return "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1";
}

/* Location: the fixed LAT/LON above by default (best for the kiosk).
   Add ?loc=me to the address to use the device's current location instead (best for a phone).
   Browsers only allow this on https:// pages, so on plain http it falls back to LAT/LON. */
function getCoords() {
  const fixed = { lat: LAT, lon: LON, note: "" };
  const q = new URLSearchParams(location.search);
  if (q.get("loc") !== "me") return Promise.resolve(fixed);
  if (!navigator.geolocation || !window.isSecureContext) {
    return Promise.resolve({ ...fixed, note: " · showing home (location needs https)" });
  }
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude.toFixed(3),
        lon: pos.coords.longitude.toFixed(3),
        note: " · your location"
      }),
      () => resolve({ ...fixed, note: " · showing home (location off)" }),
      { timeout: 10000, maximumAge: 10 * 60 * 1000 }
    );
  });
}

const status = document.getElementById("status");

/* Test mode: open the page with ?temp=30&code=71&day=1 to preview any weather.
   Optional extras: &feels= &wind= &hi= &lo= &pop= */
const q = new URLSearchParams(location.search);
if (q.has("temp") || q.has("code")) {
  const t = parseFloat(q.get("temp") ?? "60");
  render({
    temp: t, feels: parseFloat(q.get("feels") ?? t),
    code: parseInt(q.get("code") ?? "0", 10),
    wind: parseFloat(q.get("wind") ?? "5"),
    isDay: q.get("day") !== "0",
    hi: parseFloat(q.get("hi") ?? (t + 8)),
    lo: parseFloat(q.get("lo") ?? (t - 8)),
    pop: q.has("pop") ? parseFloat(q.get("pop")) : 0
  });
  status.textContent = "Test mode";
} else {
  update();
}

async function update() {
  try {
    const where = await getCoords();
    const res = await fetch(apiUrl(where.lat, where.lon), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const c = j.current, day = j.daily;
    render({
      temp: c.temperature_2m, feels: c.apparent_temperature,
      code: c.weather_code, wind: c.wind_speed_10m, isDay: c.is_day === 1,
      hi: day.temperature_2m_max[0], lo: day.temperature_2m_min[0],
      pop: day.precipitation_probability_max ? day.precipitation_probability_max[0] : null
    });
    status.textContent = "Updated " +
      new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + where.note;
    setTimeout(update, REFRESH_MS);
  } catch (e) {
    status.textContent = "Can't reach the weather service. Retrying in a minute.";
    setTimeout(update, RETRY_MS);
  }
}
